server {
  listen 80;
  index index.html;
  server_tokens off;
  client_max_body_size 20M;

  gzip on;
  gzip_min_length 100;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_buffers 4 4k;
  gzip_types text/plain text/css application/json application/javascript
  text/javascript application/xml text/xml image/jpeg 
  image/svg+xml image/x-icon;

  location /api/ {
    proxy_set_header Host $http_host;
    proxy_pass http://backend:8000/api/;
  }
  location /admin/ {
    proxy_set_header Host $http_host;
    proxy_pass http://backend:8000/admin/;
  }
  location /media/ {
    alias /media/;
  }
  location / {
    alias /static/;
    try_files $uri $uri/ /index.html;
    index index.html;
  }
}