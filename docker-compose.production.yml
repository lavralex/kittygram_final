version: '3'

volumes:
  pg_data:
  static:
  media:

services:
  db:
    container_name: postgre_db
    image: postgres:13.10
    env_file: .env
    volumes:
      - pg_data:/var/lib/postgresql/data
  backend:
    container_name: backend
    image: lavralex/kittygram_backend
    env_file: .env
    volumes:
      - static:/backend_static/
      - media:/media/
  frontend:
    container_name: frontend
    env_file: .env
    image: lavralex/kittygram_frontend
    command: cp -r /app/build/. /frontend_static/
    volumes:
      - static:/frontend_static
  gateway:
    container_name: gateway
    image: lavralex/kittygram_gateway

    volumes:
      - static:/static/
      - media:/media/
    ports:
      - 9000:80 